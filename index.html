<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="content-language" content="en" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="FlipFlap — Material You Expressive flip clock" />
    <title>FlipFlap</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,arrow_drop_down,cake,check,check_circle,checklist,close,code,delete,edit,expand_more,fullscreen,fullscreen_exit,home,menu,menu_book,menu_open,palette,radio_button_unchecked,settings,widgets"
    />
  </head>
  <body>
    <div class="app" data-nav="rail" data-page="home">
      <k3-nav-rail
        id="app-nav-rail"
        class="shell-rail"
        size="compact"
        appearance="standard"
        collapsible
        active="0"
      >
        <k3-fab slot="fab" id="rail-fab" class="rail-fab-compact" size="default" variant="primary" aria-label="Settings">
          <span slot="icon" class="ms notranslate" translate="no" lang="zxx" data-k3-icon="settings" aria-hidden="true"></span>
        </k3-fab>
        <k3-extended-fab slot="fab" id="rail-efab" class="rail-fab-extended" size="medium" variant="primary">
          <span slot="icon" class="ms notranslate" translate="no" lang="zxx" data-k3-icon="settings" aria-hidden="true"></span>
          <span data-i18n="menu.settings">Settings</span>
        </k3-extended-fab>
        <k3-nav-item id="nav-home" icon="home" label="FlipFlap" active></k3-nav-item>
        <k3-nav-item id="nav-birthdays" icon="cake" label="Birthdays"></k3-nav-item>
        <k3-nav-item id="nav-todos" icon="checklist" label="To-do"></k3-nav-item>
      </k3-nav-rail>

      <div class="shell-content" id="shell-content">
        <div id="bandeau-fr" class="bandeau gauche" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="loader" aria-busy="true" aria-live="polite"></div>

        <section id="page-home" class="app-page is-active" data-page="home">
          <div id="clock-meta" class="clock-meta" hidden>
            <time id="clock-date" datetime=""></time>
            <p id="clock-saints" class="clock-saints" hidden></p>
            <p id="clock-birthdays" class="clock-birthdays" role="status" hidden></p>
          </div>
          <div id="main">
            <div id="main-content">
              <div id="main-content-area" role="timer" aria-live="off" aria-atomic="true"></div>
            </div>
          </div>
        </section>

        <section id="page-birthdays" class="app-page" data-page="birthdays" hidden></section>
        <section id="page-todos" class="app-page" data-page="todos" hidden></section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
