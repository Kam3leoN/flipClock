<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="content-language" content="en" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="FlipFlap — Material You Expressive flip clock" />
    <title>FlipFlap</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=add,arrow_drop_down,cake,check,close,code,delete,edit,expand_more,fullscreen,fullscreen_exit,menu,menu_book,palette,settings,widgets"
    />
  </head>
  <body>
    <div id="bandeau-fr" class="bandeau gauche" aria-hidden="true"><i></i><i></i><i></i></div>
    <div id="loader" aria-busy="true" aria-live="polite"></div>
    <div id="clock-meta" class="clock-meta" hidden>
      <time id="clock-date" datetime=""></time>
      <p id="clock-saints" class="clock-saints" hidden></p>
      <p id="clock-birthdays" class="clock-birthdays" role="status" hidden></p>
    </div>
    <div id="main">
      <div id="main-content">
        <div id="main-content-area" role="timer" aria-live="off" aria-atomic="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
