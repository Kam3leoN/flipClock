<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="content-language" content="en" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,shrink-to-fit=no"
    />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="FlipClock — Material You Expressive flip clock" />
    <title>FlipClock</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=code,favorite,menu,menu_book,palette,settings,widgets"
    />
  </head>
  <body>
    <div id="loader"></div>
    <time id="clock-date" datetime="" hidden></time>
    <div id="main">
      <div id="main-content">
        <div id="main-content-area">
          <div class="flips" id="hurs">
            <div class="flip hur top"></div>
            <div class="flip bottom hur"></div>
          </div>
          <div class="flips" id="mins">
            <div class="flip min top"></div>
            <div class="flip bottom min"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
